name: AWS CI/CD

on:
  push:
    branches: [main]
  pull_request:  # pull requestでもテストを走らせる
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: bin/rails db:prepare

      - run: bundle exec rspec

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-northeast-1

      - run: aws sts get-caller-identity

      - run: |
          CMD_ID=$(aws ssm send-command \
           --instance-ids ${{ vars.INSTANCE_ID_1 }} \
           --document-name AWS-RunShellScript \
           --parameters 'commands=["sudo -u ubuntu -H bash -lc \"cd /home/ubuntu/arude && git pull --ff-only origin main && bash deploy/deploy.sh --migrate\""]' \
           --query Command.CommandId --output text)
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id ${{ vars.INSTANCE_ID_1 }} || true
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id ${{ vars.INSTANCE_ID_1 }} --query '[StandardOutputContent, StandardErrorContent]' --output text
          STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id ${{ vars.INSTANCE_ID_1 }} --query Status --output text)
          if [ "$STATUS" != "Success" ]; then
            exit 1
          fi

      - run: |
          CMD_ID=$(aws ssm send-command \
           --instance-ids ${{ vars.INSTANCE_ID_2 }} \
           --document-name AWS-RunShellScript \
           --parameters 'commands=["sudo -u ubuntu -H bash -lc \"cd /home/ubuntu/arude && git pull --ff-only origin main && bash deploy/deploy.sh\""]' \
           --query Command.CommandId --output text)
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id ${{ vars.INSTANCE_ID_2 }} || true
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id ${{ vars.INSTANCE_ID_2 }} --query '[StandardOutputContent, StandardErrorContent]' --output text
          STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id ${{ vars.INSTANCE_ID_2 }} --query Status --output text)
          if [ "$STATUS" != "Success" ]; then
            exit 1
          fi